<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Välj dina favoritbilder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
    }
    p.subtitle {
      margin: 0;
      color: #888;
      font-size: 0.95rem;
    }

    /* Flytande menyfält överst */
    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 100;
      background: rgba(30, 30, 30, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto 24px auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .status {
      font-size: 0.95rem;
    }
    .count {
      color: #3b82f6;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      background: #242424;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s ease;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #374151;
      color: #f3f4f6;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }

    /* Galleri-layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      position: relative;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      user-select: none;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #2a2a2a;
    }
    .card.selected {
      border-color: #3b82f6;
    }
    .badge {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      background: #3b82f6;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      text-align: center;
      line-height: 28px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .card.selected .badge {
      display: block;
    }
    .card-footer {
      padding: 8px;
      font-size: 0.8rem;
      color: #888;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header>
    <h1>Välj dina favoriter</h1>
    <p class="subtitle">Klicka på de bilder du gillar bäst och skicka in ditt urval.</p>
  </header>

  <div class="toolbar">
    <div class="status">Valda: <span class="count" id="count">0</span> st</div>
    <div class="actions">
      <input type="text" id="userName" placeholder="Ditt namn..." />
      <button class="btn-secondary" onclick="copySelection()">Kopiera lista</button>
      <button class="btn-primary" onclick="submitEmail()">Skicka via e-post</button>
    </div>
  </div>

  <div class="grid" id="gallery"></div>

  <script>
    // 1. Klistra in dina filnamn här (ersätt dessa exempelnamn)
    const images = [
      "1.jpg",
  "10.jpg",
  "11.jpg",
  "12.jpg",
  "13.jpg",
  "14.jpg",
  "15.jpg",
  "16.jpg",
  "17.jpg",
  "18.jpg",
  "19.jpg",
  "2.jpg",
  "20.jpg",
  "3.jpg",
  "4.jpg",
  "5.jpg",
  "6.jpg",
  "7.jpg",
  "8.jpg",
  "9.jpg"
    ];

    // Byt ut mot din e-postadress
    const recipientEmail = "din.epost@exempel.se";

    const selected = new Set();
    const gallery = document.getElementById('gallery');
    const countEl = document.getElementById('count');

    // Rendera bildkorten
    images.forEach(filename => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => {
        if (selected.has(filename)) {
          selected.delete(filename);
          card.classList.remove('selected');
        } else {
          selected.add(filename);
          card.classList.add('selected');
        }
        countEl.textContent = selected.size;
      };

      card.innerHTML = `
        <div class="badge">✓</div>
        <img src="images/${encodeURIComponent(filename)}" alt="${filename}" loading="lazy">
        <div class="card-footer">${filename}</div>
      `;
      gallery.appendChild(card);
    });

    function getPayload() {
      const name = document.getElementById('userName').value.trim() || 'En bekant';
      const list = Array.from(selected).sort().join('\n');
      return { name, count: selected.size, list };
    }

    // Alternativ A: Skicka via förifyllt e-postmeddelande
    function submitEmail() {
      if (selected.size === 0) {
        alert('Välj minst en bild innan du skickar.');
        return;
      }
      const data = getPayload();
      const subject = encodeURIComponent(`Fotourval från ${data.name}`);
      const body = encodeURIComponent(`Hej!\n\nHär är mina favoritbilder (${data.count} st):\n\n${data.list}\n`);
      window.location.href = `mailto:${recipientEmail}?subject=${subject}&body=${body}`;
    }

    // Alternativ B: Kopiera till urklipp (om besökaren föredrar att skicka via SMS/chatt)
    function copySelection() {
      if (selected.size === 0) {
        alert('Välj minst en bild innan du kopierar.');
        return;
      }
      const data = getPayload();
      const text = `Fotourval från ${data.name} (${data.count} st):\n${data.list}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('Listan har kopierats till urklipp! Du kan nu klistra in den i ett meddelande.');
      });
    }
  </script>
</body>
</html>
